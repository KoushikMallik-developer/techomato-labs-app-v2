name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A newer push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Test suite with coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          echo "### Test coverage" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const pct = (n) => n.pct.toFixed(1) + '%';
              console.log(\`Lines: **\${pct(s.lines)}** · Statements: **\${pct(s.statements)}** · Branches: **\${pct(s.branches)}** · Functions: **\${pct(s.functions)}**\`);
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report (tests failed earlier)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
        env:
          # A placeholder is enough to prove the build succeeds; the real value
          # is supplied per-environment (Vercel project settings, etc).
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: ci-placeholder
      - name: dist/ has the expected entry point
        run: test -f dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
